<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нога</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14120F;
  --panel:#1E1B16;
  --panel-2:#252119;
  --line:#332D24;
  --text:#EDE7DC;
  --text-dim:#8B8378;
  --accent:#FF8A3D;
  --accent-2:#7CC4A0;
  --danger:#E0654F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#14120F; --panel:#1E1B16; --panel-2:#252119; --line:#332D24;
    --text:#EDE7DC; --text-dim:#8B8378; --accent:#FF8A3D; --accent-2:#7CC4A0; --danger:#E0654F;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Manrope',system-ui,sans-serif;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace}

.app{max-width:520px; margin:0 auto; padding:20px 16px 40px;}

/* ---------- profile ---------- */
.profile-card{
  background:linear-gradient(165deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px 18px;
  position:relative;
  overflow:hidden;
}
.profile-card::after{
  content:"🦵"; position:absolute; right:-14px; top:-18px;
  font-size:110px; opacity:.05; transform:rotate(-12deg);
}
.profile-top{display:flex; align-items:center; gap:12px;}
.avatar{
  width:52px; height:52px; border-radius:14px;
  background:var(--accent); color:#1a1206;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; flex-shrink:0;
}
.who .name{font-weight:800; font-size:17px; line-height:1.2;}
.who .title{color:var(--accent); font-size:13px; margin-top:2px;}
.level-row{
  margin-top:16px; display:flex; align-items:baseline; justify-content:space-between;
}
.level-row .lvl{font-size:28px; font-weight:800;}
.level-row .lvl #p-level-num{font-size:var(--lvl-size, 1em); line-height:1;}
.level-row .lvl span{color:var(--text-dim); font-size:14px; font-weight:500; margin-left:6px;}
.bar{height:6px; border-radius:99px; background:var(--line); margin-top:10px; overflow:hidden;}
.bar i{display:block; height:100%; width:64%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:99px;}
.bar-label{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-top:6px;}

.stat-grid{
  margin-top:16px; display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden;
}
.stat{background:var(--panel); padding:10px 8px; text-align:center;}
.stat b{display:block; font-size:15px; font-weight:700;}
.stat span{font-size:10.5px; color:var(--text-dim);}

.status-lines{margin-top:14px; display:flex; flex-direction:column; gap:6px;}
.status-line{
  font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px;
}
.status-line b{color:var(--text); font-weight:600;}
.dot{width:5px; height:5px; border-radius:99px; background:var(--accent-2); flex-shrink:0;}
.dot.off{background:var(--line);}

/* ---------- help button ---------- */
.help-btn{
  margin-top:16px; width:100%; padding:15px 16px;
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  color:var(--text); font-family:inherit; font-weight:700; font-size:15px;
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer;
}
.help-btn:active{background:var(--panel-2);}
.help-btn .l{display:flex; align-items:center; gap:10px;}
.help-btn .ico{
  width:34px; height:34px; border-radius:10px; background:rgba(255,138,61,.14);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:17px;
}
.help-btn .chev{color:var(--text-dim); font-size:18px;}

/* ---------- overlay navigator ---------- */
.overlay{
  position:fixed; inset:0; background:var(--bg); z-index:50;
  transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
}
.overlay.open{transform:translateY(0);}
.ov-header{
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; flex-shrink:0;
  background:var(--bg);
}
.ov-back{
  width:34px; height:34px; border-radius:10px; background:var(--panel); border:1px solid var(--line);
  color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ov-title{font-weight:800; font-size:16px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ov-page{color:var(--text-dim); font-size:12px; flex-shrink:0;}
.ov-body{flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 16px 32px; -webkit-overflow-scrolling:touch;}

/* category list */
.cat-group{margin-bottom:22px;}
.cat-group-title{
  font-size:12px; color:var(--text-dim); font-weight:700; margin:0 0 8px 2px;
  letter-spacing:.02em;
}
.cat-list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.cat-item{
  background:var(--panel); padding:13px 14px; display:flex; align-items:center; justify-content:space-between;
  gap:10px; cursor:pointer;
}
.cat-item:active{background:var(--panel-2);}
.cat-item .t{font-size:14.5px; font-weight:600;}
.cat-item .chev{color:var(--text-dim); font-size:16px; flex-shrink:0;}

.nav-footer{
  display:flex; justify-content:center; gap:8px; padding:16px 0 4px;
}
.nav-dot{
  width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--text-dim); background:var(--panel); border:1px solid var(--line);
}
.nav-dot.active{color:var(--bg); background:var(--accent); border-color:var(--accent);}

/* article view */
.article h2{font-size:19px; margin:0 0 4px; font-weight:800;}
.article .crumb{color:var(--text-dim); font-size:12px; margin-bottom:16px;}
.article p{font-size:14px; line-height:1.55; color:var(--text); margin:0 0 12px;}
.article .lead{color:var(--text-dim);}
.kv{
  display:flex; flex-direction:column; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:14px 0;
}
.kv-row{background:var(--panel); padding:10px 12px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 10px; align-items:baseline;}
.kv-row .k{font-size:13px; color:var(--text-dim); min-width:0; overflow-wrap:anywhere;}
.kv-row .v{font-size:13px; text-align:right; min-width:0; overflow-wrap:anywhere; flex:1 1 auto;}
.cmd{
  display:inline-block; background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
  padding:1px 7px; font-size:12.5px; color:var(--accent-2);
}
ul.plain{margin:0 0 14px; padding-left:18px;}
ul.plain li{font-size:13.5px; line-height:1.6; margin-bottom:4px;}
.note{
  background:rgba(255,138,61,.08); border:1px solid rgba(255,138,61,.25); border-radius:10px;
  padding:10px 12px; font-size:12.5px; color:var(--text); margin:14px 0;
}
.note-purple{
  background:rgba(167,124,255,.1); border:1px solid rgba(167,124,255,.35); border-radius:10px;
  padding:10px 12px; font-size:12.5px; color:var(--text); margin:14px 0;
}
.section-h{font-size:12px; text-transform:none; color:var(--text-dim); font-weight:700; margin:18px 0 8px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;}
.mini-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 11px;}
.mini-card b{display:block; font-size:13.5px; margin-bottom:2px;}
.mini-card span{font-size:11.5px; color:var(--text-dim);}

.acc-list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:6px 0 14px;}
.acc-item{background:var(--panel);}
.acc-head{padding:11px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;}
.acc-head:active{background:var(--panel-2);}
.acc-name{font-size:13.5px; font-weight:600;}
.acc-pct{font-size:13px; color:var(--accent-2); font-family:'JetBrains Mono',monospace; flex-shrink:0;}
.acc-body{max-height:0; overflow:hidden; transition:max-height .22s ease; font-size:12px; color:var(--text-dim); line-height:1.5;}
.acc-body.open{padding:0 12px 12px;}
.acc-head.open .acc-name{color:var(--accent);}
.acc-mark{margin-left:6px; font-size:11px;}
.acc-mech{margin-top:8px; padding-top:8px; border-top:1px solid var(--line); color:var(--accent-2);}

::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>

<div class="app">
  <div class="profile-card">
    <div class="profile-top">
      <div class="avatar">🦵</div>
      <div class="who">
        <div class="name" id="p-name">Игрок</div>
        <div class="title" id="p-title">Титул: Игрок</div>
      </div>
    </div>

    <div class="level-row">
      <div class="lvl"><span id="p-level-num">27</span> <span>уровень ноги</span></div>
    </div>
    <div class="bar"><i id="p-bar" style="width:0%"></i></div>
    <div class="bar-label"><span id="p-score">— 👣</span><span id="p-next">—</span></div>

    <div class="stat-grid">
      <div class="stat"><b id="s-coin">— 🪙</b><span>коин</span></div>
      <div class="stat"><b id="s-evo">—</b><span>эволюция</span></div>
      <div class="stat"><b id="s-rb">—</b><span>перерождений</span></div>
    </div>

    <div class="status-lines">
      <div class="status-line"><span class="dot" id="vip-dot"></span><b>VIP:</b> <span id="p-vip">не активен</span></div>
      <div class="status-line"><span class="dot off" id="ultra-dot"></span><b>Статус:</b> <span id="p-status">—</span></div>
    </div>
  </div>

  <button class="help-btn" id="open-help">
    <span class="l"><span class="ico">❓</span> Помощь</span>
    <span class="chev">›</span>
  </button>
</div>

<!-- ============ NAVIGATOR OVERLAY ============ -->
<div class="overlay" id="overlay">
  <div class="ov-header">
    <button class="ov-back" id="ov-back">‹</button>
    <div class="ov-title" id="ov-title">Навигатор</div>
    <div class="ov-page" id="ov-page">1/2</div>
  </div>
  <div class="ov-body" id="ov-body"></div>
</div>

<script>
/* ======================= DATA ======================= */

const DATA = {
  page1: {
    "Валюты": {
      "гкоин (голд коин)": {
        h: "Гкоин 🌕",
        lead: "Промежуточная валюта уровня после обычных монет. Нужна на средних апгрейдах и для обмена на акоин.",
        blocks: [
          {t:"Как получить", kv:[
            ["Обмен монет","обменять гкоин &lt;кол-во&gt; — курс 1000 🪙 = 1 🌕, нужен обменник 1 лвл"],
            ["Авто-фарм","апгрейд «Авто-ферма ГКОИН»: 1 лвл 1🌕/мин · 2 лвл 5🌕/30с · 3 лвл 8🌕/20с"],
          ]},
          {t:"На что тратится", kv:[
            ["Обмен на акоин","обменять акоин &lt;кол-во&gt; — курс 1000 🌕 = 1 💎"],
            ["Апгрейды","доп. стоимость некоторых прокачек (напр. Авто-ферма ГКОИН с 6 лвл)"],
          ]},
          {t:"Прочее", kv:[
            ["Топ","топ гкоин (чат) / гл топ гкоин или топ гкоин вся (везде)"],
            ["Без апгрейдов","не добыть — обмен и авто-фарм требуют обменник соответствующего уровня"],
          ]},
        ],
      },
      "акоин (алмаз коин)": {
        h: "Акоин 💎",
        lead: "Премиальная валюта после гкоина. Основная валюта поздних апгрейдов.",
        blocks: [
          {t:"Как получить", kv:[
            ["Обмен гкоина","обменять акоин &lt;кол-во&gt; — курс 1000 🌕 = 1 💎, нужен обменник 2 лвл"],
          ]},
          {t:"На что тратится", kv:[
            ["Апгрейды","дорогие прокачки высокого уровня (напр. обменник 3 лвл — 50 акоин)"],
          ]},
          {t:"Прочее", kv:[
            ["Топ","топ акоин (чат) / гл топ акоин или топ акоин вся (везде)"],
          ]},
        ],
      },
      "коин": {
        h: "Коин 🪙",
        lead: "Базовая валюта. Основной ресурс на старте игры.",
        blocks: [
          {t:"Как получить", kv:[
            ["Фарм","часть наград за фарм ноги"],
            ["Продажа","продать б/п &lt;название&gt; — продажа бустеров и предметов"],
            ["Кейсы","авто-продажа выпавших предметов, если включена"],
          ]},
          {t:"На что тратится", kv:[
            ["Кейсы","покупка кейсов"],
            ["Обмен","обменять гкоин &lt;кол-во&gt; — 1000 🪙 = 1 🌕"],
            ["Апгрейды","стоимость базовых прокачек"],
          ]},
        ],
      },
      "очки ноги": {
        h: "Очки ноги 👣",
        lead: "Главный прогресс-ресурс — определяет уровень ноги. Обнуляются при каждой эволюции и перерождении.",
        blocks: [
          {t:"Как получить", kv:[
            ["Фарм эмодзи","отправка 🦵 / 🦿 в чат"],
            ["Команда","ферма"],
          ]},
          {t:"Механика", kv:[
            ["Порог след. уровня","растёт нелинейно, дополнительно умножается на усложнение от эволюции и перерождений"],
            ["Обнуление","сбрасываются в 0 при эволюции и при перерождении (сам счётчик эволюций/перерождений — нет)"],
          ]},
        ],
      },
      "престиж": {
        h: "Престиж 🔮",
        lead: "Валюта самого позднего слоя прогресса, идёт поверх перерождений.",
        blocks: [
          {t:"Как получить", kv:[
            ["Перерождение","+1 🔮 за каждое перерождение (PRESTIGE_PER_REBIRTH)"],
            ["Обмен очкп","обменять престиж &lt;кол-во&gt; — курс 1 🔮 = 30 🉑, нужен обменник 3 лвл"],
          ]},
          {t:"На что тратится", kv:[
            ["Апгрейдер 3 лвл","открытие обмена очкп → престиж"],
            ["Престиж-прокачки","отдельная ветка апгрейдов за престиж"],
          ]},
        ],
      },
      "очкп (очки перерождения)": {
        h: "Очки перерождения 🉑",
        lead: "Начисляются при перерождении, определяют пассивные бонусы того слоя прогресса.",
        blocks: [
          {t:"Как получить", kv:[
            ["Перерождение","команда перерождение — основной источник"],
            ["Авто-фарм очкп","апгрейд, копит пассивно"],
            ["Зелье валюты перерождения","гарантированный 🉑 за каждый фарм, пока действует"],
          ]},
          {t:"На что тратится", kv:[
            ["Апгрейды","часть прокачек в меню «апгрейд» стоит очкп напрямую"],
            ["Обмен на престиж","обменять престиж &lt;кол-во&gt; — 30 🉑 = 1 🔮"],
            ["Передача","дать очкп &lt;кол-во&gt; — открывается апгрейдом «Передача»"],
          ]},
        ],
      },
      "очкк (очки крафта)": {
        h: "Очки крафта 🛠",
        lead: "Расходуются на редкие рецепты верхнего уровня (напр. Эссенция Бога).",
        blocks: [
          {t:"Как получить", kv:[
            ["Обменник","обменять очкк &lt;кол-во&gt; — курс 100 🉑 = 1 💠 (основной способ)"],
            ["Любитель Мастерства","пока экипирован — 1% шанс за фарм дать +15 💠"],
            ["Монета Крафта","пока в инвентаре (не обязательно экипирована) — 5% шанс за отправку 🦵/🦿 дать +1 💠"],
          ]},
          {t:"На что тратится", kv:[
            ["Редкие рецепты","часть крафтов 2 уровня требует craft_points_cost сверху к ингредиентам"],
          ]},
        ],
      },
    },
    "Основное": {
      "Обменник": {
        h: "Обменник",
        lead: "Апгрейд, который поэтапно открывает обмен валют друг на друга. Ниже — все обмены в игре.",
        blocks: [
          {t:"Без апгрейда (доступны всегда)", kv:[
            ["Очки ноги → монеты","обменять &lt;кол-во монет&gt; — курс 200 👣 = 1 🪙"],
            ["Монеты → очки ноги","обменять &lt;кол-во монет&gt; коин — курс 1 🪙 = 150 👣 (обратный курс, не 1:1 с прямым)"],

          ]},
          {t:"1 лвл обменника", kv:[
            ["Монеты → гкоин","обменять гкоин &lt;кол-во&gt; — курс 1000 🪙 = 1 🌕"],
          ]},
          {t:"2 лвл обменника", kv:[
            ["Гкоин → акоин","обменять акоин &lt;кол-во&gt; — курс 1000 🌕 = 1 💎"],
          ]},
          {t:"3 лвл обменника", kv:[
            ["Очкп → престиж","обменять престиж &lt;кол-во&gt; — база 30 🉑 = 1 🔮"],
          ]},
          {t:"Улучшает курс", kv:[
            ["Апгрейд «Быстрый обмен»","снижает курс очкп→престиж: 1 лвл 27🉑 · 2 лвл 24🉑 · 3 лвл 20🉑 за 1🔮"],
          ]},
        ],
      },
      "Эволюция": {
        h: "Эволюция",
        lead: "Первый слой престижа. Сбрасывает очки ноги, но поднимает предел прогресса и добавляет усложнение.",
        blocks: [
          {t:"Как", kv:[
            ["Команда","эволюция — доступна по достижении нужного уровня ноги"],
            ["Авто-эво","с VIP срабатывает каскадно само, если очков хватает сразу на несколько"],
          ]},
          {t:"Эффект", kv:[
            ["Буст фарма","+10% с 2 эволюции, дальше +10% за каждый след. уровень эволюции (растёт без потолка)"],
            ["Усложнение","+20% к порогу уровня за каждую эволюцию (EVO_HARDNESS_RATE)"],
            ["Сброс","очки ноги обнуляются, счётчик эволюции — нет"],
          ]},
        ],
      },
      "Перерождение": {
        h: "Перерождение",
        lead: "Второй слой престижа, поверх эволюции.",
        blocks: [
          {t:"Условие", kv:[
            ["Мин. эволюция","REBIRTH_MIN_EVO = 5 — раньше перерождение недоступно"],
          ]},
          {t:"Эффект", kv:[
            ["Награда","очки перерождения (🉑) + 1 престиж (🔮) за перерождение"],
            ["Усложнение","+12.5% к порогу уровня за каждое перерождение (REBIRTH_HARDNESS_STEP)"],
            ["Сброс","очки ноги и эволюция обнуляются, счётчик перерождений — нет"],
          ]},
        ],
      },
      "Кейсы": {
        h: "Кейсы",
        lead: "Три кейса с растущей ценой и ценностью содержимого.",

/* ======================= NAV STATE ======================= */

const state = { page:1, path:[] }; // path: [categoryName] or [categoryName, itemName]

const overlay = document.getElementById('overlay');
const ovBody = document.getElementById('ov-body');
const ovTitle = document.getElementById('ov-title');
const ovPage = document.getElementById('ov-page');
const ovBack = document.getElementById('ov-back');

document.getElementById('open-help').addEventListener('click', () => {
  state.page = 1; state.path = [];
  render();
  overlay.classList.add('open');
});

ovBack.addEventListener('click', () => {
  if (state.path.length > 0) {
    state.path.pop();
    render();
  } else {
    overlay.classList.remove('open');
  }
});

function esc(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function render(){
  const pageData = state.page === 1 ? DATA.page1 : DATA.page2;
  ovPage.textContent = state.page + '/2';

  if (state.path.length === 0) {
    ovTitle.textContent = 'Навигатор';
    renderCategoryList(pageData);
  } else if (state.path.length === 1) {
    ovTitle.textContent = state.path[0];
    renderItemList(pageData[state.path[0]]);
  } else {
    const item = pageData[state.path[0]][state.path[1]];
    ovTitle.textContent = item.h;
    renderArticle(item);
  }
  ovBody.scrollTop = 0;
}

function renderCategoryList(pageData){
  let html = '<div class="cat-list">';
  for (const cat in pageData) {
    html += `<div class="cat-item" data-cat="${esc(cat)}"><span class="t">${esc(cat)}</span><span class="chev">›</span></div>`;
  }
  html += '</div>';
  html += `<div class="nav-footer">
    <div class="nav-dot ${state.page===1?'active':''}" data-goto="1">1</div>
    <div class="nav-dot ${state.page===2?'active':''}" data-goto="2">2</div>
  </div>`;
  ovBody.innerHTML = html;

  ovBody.querySelectorAll('.cat-item').forEach(el => {
    el.addEventListener('click', () => {
      state.path = [el.dataset.cat];
      render();
    });
  });
  ovBody.querySelectorAll('.nav-dot').forEach(el => {
    el.addEventListener('click', () => {
      state.page = parseInt(el.dataset.goto, 10);
      state.path = [];
      render();
    });
  });
}

function renderItemList(items){
  let html = `<div class="cat-group-title">${esc(state.path[0])}</div><div class="cat-list">`;
  for (const name in items) {
    html += `<div class="cat-item" data-item="${esc(name)}"><span class="t">${esc(name)}</span><span class="chev">›</span></div>`;
  }
  html += '</div>';
  ovBody.innerHTML = html;
  ovBody.querySelectorAll('.cat-item').forEach(el => {
    el.addEventListener('click', () => {
      state.path = [state.path[0], el.dataset.item];
      render();
    });
  });
}

function renderArticle(item){
  let html = `<div class="article">
    <div class="crumb">${esc(state.path[0])}</div>
    <h2>${esc(item.h)}</h2>`;
  if (item.lead) html += `<p class="lead">${esc(item.lead)}</p>`;

  (item.blocks || []).forEach(b => {
    if (b.t === 'note') {
      html += `<div class="note">${b.n}</div>`;
      return;
    }
    if (b.t === 'note-purple') {
      html += `<div class="note-purple">${b.n}</div>`;
      return;
    }
    if (b.t === 'accordion') {
      html += `<div class="section-h">${esc(b.label || '')}</div><div class="acc-list">`;
      b.rows.forEach(([name, pct, detail, mech], idx) => {
        const mark = mech ? '<span class="acc-mark">✨</span>' : '';
        const body = mech ? `${detail}<div class="acc-mech">${esc(mech)}</div>` : detail;
        html += `<div class="acc-item">
          <div class="acc-head" data-acc="${idx}">
            <span class="acc-name">${esc(name)}${mark}</span>
            <span class="acc-pct">${esc(pct)}</span>
          </div>
          <div class="acc-body" id="acc-body-${idx}">${body}</div>
        </div>`;
      });
      html += '</div>';
      return;
    }
    html += `<div class="section-h">${esc(b.t)}</div><div class="kv">`;
    b.kv.forEach(([k,v]) => {
      html += `<div class="kv-row"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
    });
    html += '</div>';
  });

  html += '</div>';
  ovBody.innerHTML = html;

  ovBody.querySelectorAll('.acc-head').forEach(el => {
    el.addEventListener('click', () => {
      const body = document.getElementById('acc-body-' + el.dataset.acc);
      const wasOpen = body.classList.contains('open');
      ovBody.querySelectorAll('.acc-body.open').forEach(o => { o.classList.remove('open'); o.style.maxHeight = ''; });
      ovBody.querySelectorAll('.acc-head.open').forEach(o => o.classList.remove('open'));
      if (!wasOpen) {
        body.classList.add('open');
        el.classList.add('open');
        body.style.maxHeight = body.scrollHeight + 'px';
      }
    });
  });
}

}

// Уровень ноги может дорасти до 4-5-6+ знаков (напр. 20002) — при базовых 28px это ломает
// карточку на телефоне. Чем длиннее число, тем мельче шрифт, но само число никогда не режется
// и не переносится на вторую строку.
function setLevelNumber(value) {
  const el = document.getElementById('p-level-num');
  const text = String(value ?? '—');
  el.textContent = text;
  const digits = text.replace(/[^0-9]/g, '').length;
  let scale = 1;
  if (digits >= 9) scale = 0.4;
  else if (digits >= 7) scale = 0.5;
  else if (digits >= 6) scale = 0.6;
  else if (digits >= 5) scale = 0.7;
  else if (digits >= 4) scale = 0.85;
  el.style.setProperty('--lvl-size', scale + 'em');
}

async function loadProfile() {
  try {
    if (!(window.Telegram && window.Telegram.WebApp)) return; // не в Telegram — нечего грузить
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const initData = tg.initData || "";
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) {
      document.getElementById('p-name').textContent = u.first_name || u.username || 'Игрок';
    }
    if (!initData) return; // без initData бэкенд не сможет проверить, чей это профиль

    const res = await fetch(`${API_BASE}/api/profile?init_data=${encodeURIComponent(initData)}`);
    if (!res.ok) return;
    const p = await res.json();

    document.getElementById('p-name').textContent = p.name || 'Игрок';
    document.getElementById('p-title').textContent = 'Титул: ' + p.title;
    setLevelNumber(p.level ?? '—');
    document.getElementById('p-score').textContent = `${fmt(p.score)} 👣`;
    document.getElementById('p-next').textContent = p.next_level_text || '';
    document.getElementById('s-coin').textContent = `${fmt(p.coins)} 🪙`;
    document.getElementById('s-evo').textContent = p.evolution_level;
    document.getElementById('s-rb').textContent = p.rebirth_count;

    const vipEl = document.getElementById('p-vip');
    const vipDot = document.getElementById('vip-dot');
    if (p.vip_active) {
      vipEl.textContent = 'активен';
      vipDot.classList.remove('off');
    } else {
      vipEl.textContent = 'не активен';
      vipDot.classList.add('off');
    }

    const statusEl = document.getElementById('p-status');
    const ultraDot = document.getElementById('ultra-dot');
    if (p.ultra_rebirth) {
      statusEl.textContent = 'Ультра перерождение пройдено';
      ultraDot.classList.remove('off');
    } else {
      statusEl.textContent = `Буст +${p.boost_pct}% · сложность +${p.hardness_pct}%`;
      ultraDot.classList.add('off');
    }
  } catch (e) {
    console.error('Не удалось загрузить профиль:', e);
  }
}

loadProfile();
</script>
